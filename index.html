    <!-- PLAYER — canto inferior esquerdo -->
    <div class="player-corner" id="player-corner">

        <!-- Disco girando -->
        <div class="vinyl-wrap">
            <div class="vinyl-disc" id="vinyl-disc">
                <img src="disco.png" alt="album" class="disc-art">
                <div class="disc-hole"></div>
                <!-- reflexo giratório -->
                <div class="disc-shine"></div>
            </div>
        </div>

        <!-- Controles -->
        <div class="player-controls">
            <button id="btn-play" class="ctrl" title="Play/Pause">
                <svg id="icon-play" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
                <svg id="icon-pause" class="hidden" viewBox="0 0 24 24"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>
            </button>

            <button id="btn-mute" class="ctrl" title="Mute">
                <svg id="icon-vol" viewBox="0 0 24 24"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M15.54,8.46a5,5,0,0,1,0,7.07"/></svg>

            </button>

            <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" title="Volume">
        </div>

        <input type="range" id="prog" class="prog-bar" min="0" max="100" step="0.1" value="0" title="Progresso">
        <span class="track-label">21 Anos — Gyylo</span>
    </div>
